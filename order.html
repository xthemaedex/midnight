<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Midnight — private preview</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#051122">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html { background: #051122; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; overflow: hidden;
      color: #fff; font: 400 16px/1.5 "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(120% 80% at 50% 0%, #1b3566 0, #0a1a34 45%, #051122 100%);
      -webkit-font-smoothing: antialiased;
    }
    .s { position: fixed; border-radius: 50%; background: #fff; opacity: 0; animation: tw var(--t) ease-in-out var(--d) infinite; }
    @keyframes tw { 0%, 100% { opacity: .05; transform: scale(.7); } 50% { opacity: .85; transform: scale(1.25); } }

    .card { position: relative; z-index: 1; width: min(100%, 380px); display: grid; justify-items: center; text-align: center; gap: 0; transition: opacity .5s; }
    body.is-checking .card { opacity: 0; }
    .card { animation: up 1s cubic-bezier(.22, .8, .24, 1) both; }
    @keyframes up { from { opacity: 0; transform: translateY(24px); filter: blur(6px); } }

    .moon {
      width: 92px; height: 92px; margin-bottom: 26px; border-radius: 50%;
      background:
        radial-gradient(circle at 62% 66%, rgba(60, 70, 90, .35) 0 9%, transparent 10%),
        radial-gradient(circle at 34% 40%, rgba(60, 70, 90, .3) 0 13%, transparent 14%),
        radial-gradient(circle at 70% 30%, rgba(60, 70, 90, .22) 0 7%, transparent 8%),
        radial-gradient(circle at 35% 32%, #f4f6fa 0, #cfd5df 38%, #8a94a6 78%, #596273 100%);
      box-shadow: 0 0 70px rgba(220, 230, 255, .32), 0 0 18px rgba(246, 233, 196, .25);
      animation: glow 5s ease-in-out infinite;
    }
    @keyframes glow { 50% { box-shadow: 0 0 90px rgba(246, 233, 196, .42), 0 0 22px rgba(246, 233, 196, .35); } }

    .brand { margin: 0; font-weight: 600; font-size: 20px; letter-spacing: .4em; padding-left: .4em; }
    .sub { margin: 10px 0 30px; font-size: 12px; font-weight: 500; letter-spacing: .26em; text-transform: uppercase; color: rgba(255, 255, 255, .62); }

    form { width: 100%; display: grid; gap: 14px; }
    .field { position: relative; }
    input[type="password"], input[type="text"] {
      width: 100%; height: 54px; padding: 0 78px 0 20px; color: #fff; font: 400 16px/1 "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: .04em;
      border: 1px solid rgba(255, 255, 255, .35); border-radius: 999px; outline: none; background: rgba(39, 56, 78, .6);
      transition: border-color .3s, box-shadow .4s, background-color .3s;
    }
    input::placeholder { color: rgba(255, 255, 255, .4); letter-spacing: 0; }
    input:focus { border-color: #f6e9c4; background: rgba(39, 56, 78, .9); box-shadow: 0 0 0 4px rgba(246, 233, 196, .14); }
    .show {
      position: absolute; right: 8px; top: 8px; height: 38px; padding: 0 14px; cursor: pointer;
      border: 0; border-radius: 999px; background: transparent; color: rgba(255, 255, 255, .7);
      font: 500 12px/1 "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: .12em; text-transform: uppercase; transition: color .3s, background-color .3s;
    }
    .show:hover { color: #fff; background: rgba(255, 255, 255, .1); }

    .keep { display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; font-size: 14px; color: rgba(255, 255, 255, .78); }
    .keep input { width: 18px; height: 18px; margin: 0; accent-color: #f6e9c4; cursor: pointer; }

    button.go {
      position: relative; overflow: hidden; height: 54px; cursor: pointer; border: 1px solid #fff; border-radius: 999px;
      background: #fff; color: #051122; font: 500 15px/1 "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: .06em;
      transition: transform .5s cubic-bezier(.22, .8, .24, 1), box-shadow .5s, background-color .35s, color .35s;
    }
    button.go:hover:not(:disabled) { transform: translateY(-3px); background: #f6e9c4; border-color: #f6e9c4; box-shadow: 0 16px 36px -14px rgba(246, 233, 196, .7); }
    button.go:disabled { cursor: progress; opacity: .8; }
    :focus-visible { outline: 2px solid #f6e9c4; outline-offset: 3px; }

    .msg { min-height: 22px; margin: 16px 0 0; font-size: 14px; color: #ffd2c4; }
    .shake { animation: shake .5s cubic-bezier(.22, .8, .24, 1); }
    @keyframes shake { 20% { transform: translateX(-8px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(2px); } }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001s !important; animation-iteration-count: 1 !important; transition-duration: .001s !important; } }
  </style>
</head>

      </div>
      <label class="keep"><input id="keep" type="checkbox"> Keep me in on this device</label>

    </form>

  <script>
  (() => {
    'use strict';
    const ITER = 600000;
    const STORE = 'midnight-access-v1';
    const $ = (id) => document.getElementById(id);
    const enc = new TextEncoder();
    const dec = new TextDecoder();
    const fromB64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
    const toB64 = (u8) => btoa(String.fromCharCode(...u8));
    const SALT = fromB64('uzx0vk/C35swe4qQith5hg==');
    const sealed = fromB64($('payload').textContent.trim());           // iv (12) | ciphertext | tag (16)

    const card = $('card'), form = $('gate'), input = $('code'), msg = $('msg'), go = $('go'), keep = $('keep');

    for (let i = 0; i < 60; i++) {                                      // a few stars
      const s = document.createElement('i');
      const size = Math.random() * 2 + 1;
      s.className = 's';
      s.style.cssText = `left:${Math.random() * 100}%;top:${Math.random() * 100}%;width:${size}px;height:${size}px;--t:${(Math.random() * 4 + 3).toFixed(1)}s;--d:-${(Math.random() * 6).toFixed(1)}s`;
      document.body.prepend(s);
    }

    /** Decrypts the page with a raw 256-bit key. Rejects with 'wrong' for a bad key, 'network' if an image can't load. */
    async function unlock(raw) {
      const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
      const open = (buf) => crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.subarray(0, 12) }, key, buf.subarray(12));
      let page;
      try { page = JSON.parse(dec.decode(await open(sealed))); } catch (_) { throw 'wrong'; }
      let html = page.html;
      const paths = Object.keys(page.assets).sort((a, b) => b.length - a.length);
      let urls;
      try {
        urls = await Promise.all(paths.map(async (p) => {               // images are encrypted too: fetch, decrypt, hand out as blob URLs
          const res = await fetch(page.assets[p].f);
          if (!res.ok) throw new Error(String(res.status));
          const bin = new Uint8Array(await res.arrayBuffer());
          return URL.createObjectURL(new Blob([await open(bin)], { type: page.assets[p].t }));
        }));
      } catch (_) { throw 'network'; }
      paths.forEach((p, i) => { html = html.split(p).join(urls[i]); });
      return html;
    }

    const render = (html) => { document.open(); document.write(html); document.close(); };

    async function derive(code) {
      const base = await crypto.subtle.importKey('raw', enc.encode(code), 'PBKDF2', false, ['deriveBits']);
      return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: SALT, iterations: ITER }, base, 256));
    }

    function fail(text) {
      msg.textContent = text;
      card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
      go.disabled = false; go.textContent = 'Enter';
      input.focus(); input.select();
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const code = input.value.trim();
      if (!code) return fail('Enter your access code.');
      msg.textContent = '';
      go.disabled = true; go.textContent = 'Unlocking…';
      try {
        const raw = await derive(code);
        const html = await unlock(raw);
        try {                                                           // remember the derived key (never the code) so other pages open straight away
          sessionStorage.setItem(STORE, toB64(raw));
          if (keep.checked) localStorage.setItem(STORE, toB64(raw)); else localStorage.removeItem(STORE);
        } catch (_) { /* storage blocked: every page will ask again */ }
        render(html);
      } catch (err) {
        fail(err === 'network' ? 'Couldn’t load the page. Check your connection and try again.' : 'That code didn’t work. Try again.');
      }
    });

    $('show').addEventListener('click', () => {
      const hidden = input.type === 'password';
      input.type = hidden ? 'text' : 'password';
      $('show').textContent = hidden ? 'Hide' : 'Show';
      input.focus();
    });

    if (!window.crypto || !crypto.subtle) {
      document.body.classList.remove('is-checking');
      go.disabled = true;
      msg.textContent = 'This page needs a secure (https) connection to unlock.';
      return;
    }

    let saved = null;
    try { saved = sessionStorage.getItem(STORE) || localStorage.getItem(STORE); } catch (_) { /* blocked */ }
    if (!saved) { document.body.classList.remove('is-checking'); input.focus(); return; }
    unlock(fromB64(saved)).then(render, () => {                         // a saved key that no longer fits (the code changed): ask again
      try { sessionStorage.removeItem(STORE); localStorage.removeItem(STORE); } catch (_) { /* blocked */ }
      document.body.classList.remove('is-checking');
      input.focus();
    });
  })();
  </script>
